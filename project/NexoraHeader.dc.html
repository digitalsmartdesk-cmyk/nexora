<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="position:sticky; top:0; z-index:40; width:100%;">
  <div style="background:#0B1F4B; color:#EAF1FF; font-family:Inter,sans-serif; font-size:12px; font-weight:500; letter-spacing:0.01em; padding:7px 12px; text-align:center;">{{ currentAnnouncement }}</div>
  <div style="background:#FFFFFF; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; box-shadow:0 1px 0 rgba(11,31,75,0.06);">
    <a href="{{ homeHref }}" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
      <div style="width:36px; height:36px; border-radius:50%; overflow:hidden; background-image:url('./assets/nexora-logo.png'); background-size:420% 420%; background-position:50% 14%; flex-shrink:0;"></div>
      <span style="font-family:Poppins,sans-serif; font-weight:800; font-size:17px; color:#0B1F4B; letter-spacing:-0.01em;">Nexora</span>
    </a>
    <div style="display:flex; align-items:center; gap:8px;">
      <button onClick="{{ onToggleLang }}" style="font-family:Inter,sans-serif; font-weight:600; font-size:12px; color:#1E6FE0; background:#EAF2FF; border:none; border-radius:20px; padding:6px 11px; cursor:pointer;">{{ langLabel }}</button>
      <button onClick="{{ onCartClick }}" aria-label="Cart" style="position:relative; width:36px; height:36px; border-radius:50%; border:1px solid #E3E8F2; background:#F7F9FC; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <sc-if value="{{ hasCartCount }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute; top:-3px; right:-3px; min-width:16px; height:16px; padding:0 3px; border-radius:9px; background:#1E6FE0; color:#fff; font-family:Inter,sans-serif; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;">{{ cartCount }}</span>
        </sc-if>
      </button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:100},&quot;lang&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onToggleLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onCartClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;homeHref&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;./Nexora Homepage.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tick: 0 };

  componentDidMount() {
    this._timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 2800);
  }

  componentWillUnmount() {
    clearInterval(this._timer);
  }

  renderVals() {
    const lang = this.props.lang ?? 'en';
    const cartCount = this.props.cartCount ?? 0;
    const linesEn = ['COD Available ✓ Free Shipping over ₹699', '7-Day Easy Replacement ✓', 'GST-Registered Indian Brand'];
    const linesHi = ['COD Available ✓ ₹699 se upar Free Shipping', '7-Din Aasan Replacement ✓', 'GST-Registered Indian Brand'];
    const lines = lang === 'hi' ? linesHi : linesEn;
    return {
      homeHref: this.props.homeHref ?? './Nexora Homepage.dc.html',
      langLabel: lang === 'hi' ? 'EN' : 'हिं / EN',
      onToggleLang: this.props.onToggleLang ?? (() => {}),
      cartCount,
      hasCartCount: cartCount > 0,
      onCartClick: this.props.onCartClick ?? (() => {}),
      currentAnnouncement: lines[this.state.tick % lines.length],
    };
  }
}
</script>
</body>
</html>
