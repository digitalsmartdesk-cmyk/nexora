<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed; inset:0; z-index:100;">
    <div onClick="{{ onClose }}" style="position:absolute; inset:0; background:rgba(11,31,75,0.45);"></div>
    <div style="position:absolute; top:0; right:0; height:100%; width:min(88vw,380px); background:#F7F9FC; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(11,31,75,0.15);">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:16px; background:#FFFFFF; border-bottom:1px solid #EBEFF6;">
        <span style="font-family:Poppins,sans-serif; font-weight:700; font-size:16px; color:#0B1F4B;">Your Cart ({{ count }})</span>
        <button onClick="{{ onClose }}" style="width:30px; height:30px; border-radius:50%; border:none; background:#F1F4F9; cursor:pointer; font-size:16px; color:#0B1F4B;">✕</button>
      </div>
      <div style="flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:12px;">
        <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{ items }}" as="item" hint-placeholder-count="2">
            <div style="display:flex; gap:10px; background:#FFFFFF; border-radius:12px; padding:10px; align-items:center;">
              <div style="width:56px; height:56px; border-radius:8px; flex-shrink:0; background:repeating-linear-gradient(135deg,#EAF1FF,#EAF1FF 6px,#F7F9FC 6px,#F7F9FC 12px); display:flex; align-items:center; justify-content:center; font-family:'Courier New',monospace; font-size:7px; color:#7C89A8; text-align:center;">IMG</div>
              <div style="flex:1; min-width:0;">
                <div style="font-family:Inter,sans-serif; font-weight:600; font-size:13px; color:#0B1F4B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ item.name }}</div>
                <div style="font-family:Inter,sans-serif; font-weight:700; font-size:13px; color:#1E6FE0; margin-top:2px;">{{ item.priceLabel }}</div>
              </div>
              <div style="display:flex; align-items:center; gap:6px; background:#F1F4F9; border-radius:20px; padding:4px 8px;">
                <button onClick="{{ item.onDec }}" style="width:20px; height:20px; border:none; background:none; font-size:14px; color:#0B1F4B; cursor:pointer;">−</button>
                <span style="font-family:Inter,sans-serif; font-size:12px; font-weight:600; min-width:14px; text-align:center;">{{ item.qty }}</span>
                <button onClick="{{ item.onInc }}" style="width:20px; height:20px; border:none; background:none; font-size:14px; color:#0B1F4B; cursor:pointer;">+</button>
              </div>
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="text-align:center; padding:40px 12px; color:#8892A6; font-family:Inter,sans-serif; font-size:13px;">Cart khaali hai. Kuch smart add karo! 🛒</div>
        </sc-if>
      </div>
      <div style="padding:14px 16px 20px; background:#FFFFFF; border-top:1px solid #EBEFF6;">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-family:Inter,sans-serif;">
          <span style="font-size:13px; color:#55607A;">Total</span>
          <span style="font-size:16px; font-weight:700; color:#0B1F4B;">{{ totalLabel }}</span>
        </div>
        <button style="width:100%; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,#1E6FE0,#38B6FF); color:#fff; font-family:Poppins,sans-serif; font-weight:700; font-size:14px; cursor:pointer;">Checkout — COD Available</button>
      </div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:500},&quot;open&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{id:string,name:string,price:number,qty:number}[]&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onQtyChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string,qty:number) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items ?? [];
    const inr = n => '₹' + n.toLocaleString('en-IN');
    const count = items.reduce((s, i) => s + i.qty, 0);
    const total = items.reduce((s, i) => s + i.qty * i.price, 0);
    const onQty = this.props.onQtyChange ?? (() => {});
    return {
      open: this.props.open ?? false,
      onClose: this.props.onClose ?? (() => {}),
      count,
      hasItems: items.length > 0,
      empty: items.length === 0,
      totalLabel: inr(total),
      items: items.map(i => ({
        ...i,
        priceLabel: inr(i.price),
        onInc: () => onQty(i.id, i.qty + 1),
        onDec: () => onQty(i.id, Math.max(0, i.qty - 1)),
      })),
    };
  }
}
</script>
</body>
</html>
