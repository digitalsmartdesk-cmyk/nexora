<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { margin:0; background:#DDE3ED; } ::-webkit-scrollbar { display:none; } </style>
</helmet>
<div style="background:#DDE3ED; min-height:100vh; display:flex; justify-content:center; font-family:Inter,sans-serif;">
<div style="width:100%; max-width:430px; background:#F7F9FC; min-height:100vh; box-shadow:0 0 40px rgba(11,31,75,0.12); display:flex; flex-direction:column;">

  <dc-import name="NexoraHeader" cart-count="{{ cartCount }}" lang="{{ lang }}" on-toggle-lang="{{ toggleLang }}" on-cart-click="{{ openCart }}" hint-size="100%,66px"></dc-import>

  <div style="padding:20px 16px 4px;">
    <h1 style="margin:0 0 4px; font-family:Poppins,sans-serif; font-weight:800; font-size:21px; color:#0B1F4B;">Track Your Order</h1>
    <div style="font-family:Inter,sans-serif; font-size:13px; color:#7C89A8; margin-bottom:18px;">Order number ya phone number daalo — status turant milega.</div>

    <div style="background:#FFFFFF; border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(11,31,75,0.06); margin-bottom:18px;">
      <label style="font-family:Inter,sans-serif; font-size:12px; font-weight:600; color:#3A4560; display:block; margin-bottom:6px;">Order ID or Mobile Number</label>
      <input placeholder="e.g. NXR10293 or 98XXXXXX10" style="width:100%; box-sizing:border-box; padding:12px 13px; border-radius:9px; border:1px solid #E3E8F2; background:#F7F9FC; font-family:Inter,sans-serif; font-size:13.5px; margin-bottom:10px;" />
      <button onClick="{{ track }}" style="width:100%; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,#1E6FE0,#38B6FF); color:#fff; font-family:Poppins,sans-serif; font-weight:700; font-size:14px; cursor:pointer;">Track Order</button>
    </div>

    <sc-if value="{{ showResult }}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFFFFF; border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(11,31,75,0.06); margin-bottom:18px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
          <span style="font-family:Inter,sans-serif; font-size:12px; color:#7C89A8;">Order #NXR10293</span>
          <span style="font-family:Inter,sans-serif; font-size:11px; font-weight:700; color:#1E6FE0; background:#EAF2FF; padding:3px 9px; border-radius:12px;">Out for Delivery</span>
        </div>
        <div style="display:flex; align-items:center;">
          <sc-for list="{{ trackSteps }}" as="step" hint-placeholder-count="4">
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; position:relative;">
              <div style="width:22px; height:22px; border-radius:50%; background:{{ step.bg }}; display:flex; align-items:center; justify-content:center; z-index:1;">
                <sc-if value="{{ step.done }}" hint-placeholder-val="{{ false }}">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                </sc-if>
              </div>
              <span style="font-family:Inter,sans-serif; font-size:9.5px; font-weight:600; color:{{ step.textColor }}; text-align:center; margin-top:5px;">{{ step.label }}</span>
            </div>
          </sc-for>
        </div>
        <div style="height:2px; background:#EBEFF6; margin:-30px 32px 0; position:relative; z-index:0;"></div>
        <div style="font-family:Inter,sans-serif; font-size:12.5px; color:#3A4560; margin-top:16px; text-align:center;">Aaj shaam 6–9 PM tak pahunch jayega. 📦</div>
      </div>
    </sc-if>

    <div style="background:#EAF2FF; border-radius:14px; padding:16px; display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#25D366" style="flex-shrink:0;"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.39a9.9 9.9 0 0 0 4.76 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2z"></path></svg>
      <div style="flex:1;">
        <div style="font-family:Inter,sans-serif; font-weight:700; font-size:12.5px; color:#0B1F4B;">Order mein dikkat?</div>
        <div style="font-family:Inter,sans-serif; font-size:11.5px; color:#3A4560;">WhatsApp pe seedha baat karo</div>
      </div>
      <a href="https://wa.me/919999999999" target="_blank" style="text-decoration:none; padding:8px 14px; border-radius:8px; border:1.5px solid #25D366; color:#128C4A; font-family:Inter,sans-serif; font-weight:700; font-size:12px; white-space:nowrap;">Chat</a>
    </div>
  </div>

  <div style="flex:1;"></div>

  <dc-import name="NexoraBottomNav" active="track" hint-size="100%,66px"></dc-import>
  <dc-import name="NexoraCartDrawer" open="{{ cartOpen }}" items="{{ cartItems }}" on-close="{{ closeCart }}" on-qty-change="{{ setQty }}" hint-size="0,0"></dc-import>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en', cartOpen: false, cart: {}, PRODUCTS: [], showResult: false };

  componentDidMount() {
    import('./products.js').then(m => {
      const cart = {};
      try { Object.assign(cart, JSON.parse(localStorage.getItem('nexora_cart') || '{}')); } catch (e) {}
      this.setState({ PRODUCTS: m.PRODUCTS, cart });
    });
  }

  setQty(id, qty) {
    const cart = { ...this.state.cart };
    if (qty <= 0) delete cart[id]; else cart[id] = qty;
    this.setState({ cart });
    try { localStorage.setItem('nexora_cart', JSON.stringify(cart)); } catch (e) {}
  }

  renderVals() {
    const byId = id => this.state.PRODUCTS.find(p => p.id === id);
    const cartItems = Object.entries(this.state.cart).map(([id, qty]) => {
      const p = byId(id); return p ? { id, name: p.name, price: p.price, qty } : null;
    }).filter(Boolean);
    const cartCount = cartItems.reduce((s, i) => s + i.qty, 0);

    const stepLabels = ['Ordered', 'Shipped', 'Out for Delivery', 'Delivered'];
    const trackSteps = stepLabels.map((label, i) => ({
      label, done: i < 3,
      bg: i < 3 ? '#1E6FE0' : '#D9E0EC',
      textColor: i < 3 ? '#0B1F4B' : '#A6AEC2',
    }));

    return {
      lang: this.state.lang,
      toggleLang: () => this.setState({ lang: this.state.lang === 'hi' ? 'en' : 'hi' }),
      cartCount,
      cartOpen: this.state.cartOpen,
      cartItems,
      openCart: () => this.setState({ cartOpen: true }),
      closeCart: () => this.setState({ cartOpen: false }),
      setQty: (id, qty) => this.setQty(id, qty),
      showResult: this.state.showResult,
      track: () => this.setState({ showResult: true }),
      trackSteps,
    };
  }
}
</script>
</body>
</html>
